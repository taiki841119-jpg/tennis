<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a4d">
<title>テニス乱数表</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%BE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<style>
  .top { text-align: center; padding-top: 24px; }
  .top h1 { font-size: 30px; margin: 8px 0 4px; }
  .choice { display: block; text-decoration: none; color: var(--text); text-align: left; margin: 18px 0;
    padding: 22px 20px; border: 2px solid var(--accent); border-radius: 18px; background: var(--card); }
  .choice:active { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .choice .t { font-size: 24px; font-weight: 800; color: var(--accent); }
  .choice .d { font-size: 17px; margin-top: 6px; }
  .choice .m { font-size: 14px; color: var(--sub); margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap top">
  <div style="font-size:56px">🎾</div>
  <h1>テニス乱数表</h1>
  <div class="sub" style="font-size:16px">使い方を選んでください</div>

  <a class="choice" href="simple.html">
    <div class="t">① かんたん版</div>
    <div class="d">人数を入れて、番号で試合を決める</div>
    <div class="m">ログイン不要 ／ 自分のスマホだけで使う</div>
  </a>

  <a class="choice" href="group.html">
    <div class="t">② 名簿・グループ版</div>
    <div class="d">名簿を作って、みんなで同じ画面を見る</div>
    <div class="m">グループ名と合言葉が必要 ／ 複数の人が同時に使える</div>
  </a>
</div>
</body>
</html>
