<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a4d">
<title>テニス乱数表 かんたん版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%BE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<style>
  .stepper { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 18px 0; }
  .stepper button { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--accent); background: transparent;
    color: var(--accent); font-size: 28px; }
  .stepper .num { font-size: 56px; font-weight: 800; min-width: 2.2em; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 10px; }
  .cardx { aspect-ratio: 1; border-radius: 14px; border: 0; background: var(--accent); color: #fff; font-size: 30px; font-weight: 800; }
  .cardx.taken { background: var(--line); color: var(--sub); font-size: 15px; font-weight: 500; }
  .cardx:disabled { cursor: default; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.82); display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 30; color: #fff; gap: 18px; }
  .overlay .big { font-size: 160px; font-weight: 900; line-height: 1; }
  .overlay .btn { min-width: 220px; font-size: 18px; }
  .tog { min-width: 64px; min-height: 56px; text-align: center; font-size: 22px; font-weight: 800; }
  .match .pair { font-size: 34px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<script src="logic.js"></script>
<script src="simple.js"></script>
</body>
</html>
